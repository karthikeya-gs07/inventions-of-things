<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#14181c" />
    <meta name="description" content="Take everyday objects apart in 3D and see the inventions that made each part possible." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inventions" />
    <title>What Inventions Made Things Work</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="view" aria-label="3D viewport"></canvas>
      <div id="markers"></div>

      <header class="brand">
        <h1>What <em>Inventions</em><br />Made Things Work</h1>
      </header>

      <!-- Touch layouts (phones, unfolded foldables): gestures replace the toolbar -->
      <nav class="quick" aria-label="View controls">
        <button data-act="reset" data-icon="frame" aria-label="Reset view" title="Reset view"></button>
        <button data-act="explode" data-icon="explode" aria-pressed="false" aria-label="Exploded view" title="Exploded view"></button>
        <button data-act="studio" data-icon="sun" aria-pressed="false" aria-label="Studio look" title="Studio look"></button>
      </nav>

      <button class="lib-toggle" id="lib-toggle" aria-expanded="false" aria-controls="library">Objects</button>
      <aside class="panel library" id="library" aria-label="Objects"></aside>
      <aside class="panel detail" id="detail" aria-live="polite"></aside>

      <dl class="legend" aria-label="Mouse controls">
        <div><dt>Drag</dt><dd>Orbit</dd></div>
        <div><dt>Shift + drag</dt><dd>Pan</dd></div>
        <div><dt>Scroll</dt><dd>Zoom</dd></div>
        <div><dt>Click a dot</dt><dd>See the invention</dd></div>
      </dl>

      <nav class="toolbar" aria-label="Viewport controls">
        <div class="seg" role="group" aria-label="Left-drag action">
          <button data-mode="orbit" data-icon="orbit" aria-pressed="true"><span>Orbit</span></button>
          <button data-mode="pan" data-icon="pan" aria-pressed="false"><span>Pan</span></button>
          <button data-mode="zoom" data-icon="zoom" aria-pressed="false"><span>Zoom</span></button>
        </div>
        <div class="seg" role="group" aria-label="Zoom">
          <button data-act="zoom-out" data-icon="minus" aria-label="Zoom out" title="Zoom out"></button>
          <button data-act="zoom-in" data-icon="plus" aria-label="Zoom in" title="Zoom in"></button>
        </div>
        <div class="seg">
          <button data-act="explode" data-icon="explode" aria-pressed="false" title="Pull the parts apart (E)"><span>Explode</span></button>
          <button data-act="reset" data-icon="frame" title="Reset the view (R)"><span>Reset<span class="wide">&nbsp;view</span></span></button>
          <button data-act="studio" data-icon="sun" aria-pressed="false" title="Pale backdrop with soft light (L)"><span>Studio</span></button>
        </div>
      </nav>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
